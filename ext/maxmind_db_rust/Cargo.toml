[package]
name = "maxmind_db_rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Gregory Oschwald <oschwald@gmail.com>"]
description = "Rust-based Ruby binding for MaxMind DB - high-performance alternative to maxmind-db"
license = "ISC"
repository = "https://github.com/oschwald/maxmind-db-rust-ruby"

[lib]
name = "maxmind_db_rust"
crate-type = ["cdylib"]

[dependencies]
arc-swap = "1.9"
ipnetwork = "0.21"
magnus = { version = "0.9", features = ["rb-sys"] }
maxminddb = "0.33.0"
memmap2 = "0.9"
rb-sys = { version = "0.9", default-features = false }
rustc-hash = "2.1"
self_cell = "1.3"
serde = "1.0"
