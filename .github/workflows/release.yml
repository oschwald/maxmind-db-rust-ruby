name: Build and Release

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build native gems for each platform
  build-native-gems:
    name: Build native gem for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86_64-linux
          - aarch64-linux
          - x86_64-darwin
          - arm64-darwin
          - x64-mingw-ucrt
          - x86_64-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Ruby
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1
        with:
          ruby-version: "4.0"

      - name: Build native gem
        uses: oxidize-rb/actions/cross-gem@e5f9a49a7812a078584072f6e3f657ad247c8771 # v1
        id: cross-gem
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: "3.2,3.3,3.4,4.0"

      - name: Upload gem artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gem-${{ matrix.platform }}
          path: ${{ steps.cross-gem.outputs.gem-path }}
          if-no-files-found: error

  # Build source gem (fallback for unsupported platforms)
  build-source-gem:
    name: Build source gem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Ruby
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1
        with:
          ruby-version: "4.0"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Build source gem
        run: |
          gem build maxmind-db-rust.gemspec

      - name: Smoke test source gem
        run: |
          install_dir="$(mktemp -d)"
          gcc_include="$(dirname "$(dirname "$(command -v gcc)")")/lib/gcc/$(gcc -dumpmachine)/$(gcc -dumpversion | cut -d. -f1)/include"
          BINDGEN_EXTRA_CLANG_ARGS="-I${gcc_include}" gem install ./*.gem --install-dir "$install_dir" --bindir "$install_dir/bin" --no-document
          GEM_HOME="$install_dir" GEM_PATH="$install_dir" ruby -e 'require "maxmind/db/rust"; puts MaxMind::DB::Rust::Reader'

      - name: Upload source gem artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gem-source
          path: "*.gem"
          if-no-files-found: error

  # Release all gems to RubyGems (only on release events)
  release:
    name: Release gems to RubyGems.org
    runs-on: ubuntu-latest
    needs: [build-native-gems, build-source-gem]
    if: github.event_name == 'release'
    environment: RubyGems

    permissions:
      id-token: write # Required for trusted publishing
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1
        with:
          ruby-version: "4.0"

      - name: Download all gem artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: all-gems
          pattern: gem-*
          merge-multiple: true

      - name: List gems to be released
        run: |
          echo "Gems to be released:"
          ls -lh all-gems/

      - name: Configure RubyGems for trusted publishing
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish gems to RubyGems.org
        run: |
          set -euo pipefail
          for gem in all-gems/*.gem; do
            echo "Publishing $gem"
            gem push "$gem"
          done
