name: Build and Release

on:
  push:
    branches:
      - main
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

# Cancel superseded runs for the same pull request. Other events get a
# unique group so they never cancel each other.
concurrency:
  group: release-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Run the test workflow before publishing a release
  test:
    name: Test
    if: github.event_name == 'release'
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  # Check that the release tag matches the gemspec version
  check-version:
    name: Check release tag matches gem version
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare tag and gemspec version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(sed -n -E "s/^[[:space:]]*s\.version[[:space:]]*=[[:space:]]*'([^']+)'.*/\1/p" maxmind-db-rust.gemspec)"
          if [ -z "$version" ]; then
            echo "::error::Could not read s.version from maxmind-db-rust.gemspec"
            exit 1
          fi
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match gemspec version $version (expected v$version)"
            exit 1
          fi
          echo "Release tag $RELEASE_TAG matches gemspec version $version"

  # Build native gems for each platform
  build-native-gems:
    name: Build native gem for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86_64-linux
          - aarch64-linux
          - x86_64-darwin
          - arm64-darwin
          - x64-mingw-ucrt
          - x86_64-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1
        with:
          ruby-version: "4.0"

      - name: Build native gem
        uses: oxidize-rb/actions/cross-gem@ec90b4aa48795518d79be3f5cc478d1d7ccd02a8 # v1
        id: cross-gem
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: "3.3,3.4,4.0"

      - name: Upload gem artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gem-${{ matrix.platform }}
          path: ${{ steps.cross-gem.outputs.gem-path }}
          if-no-files-found: error

  # Install each native gem and load its extension
  smoke-test-native-gems:
    name: Smoke test ${{ matrix.platform }} gem on Ruby ${{ matrix.ruby }}
    needs: build-native-gems
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86_64-linux
          - aarch64-linux
          - x86_64-darwin
          - arm64-darwin
          - x64-mingw-ucrt
        ruby: ["3.3", "3.4", "4.0"]
        include:
          - platform: x86_64-linux
            os: ubuntu-latest
          - platform: aarch64-linux
            os: ubuntu-24.04-arm
          - platform: x86_64-darwin
            os: macos-15-intel
          - platform: arm64-darwin
            os: macos-latest
          - platform: x64-mingw-ucrt
            os: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Download gem artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gem-${{ matrix.platform }}

      - name: Smoke test native gem
        run: | # zizmor: ignore[adhoc-packages] installs the gem this run built; the job has no secrets or publish rights
          gem install ./*.gem --no-document
          ruby -e 'require "maxmind/db/rust"; puts MaxMind::DB::Rust::Reader'

  smoke-test-musl-gem:
    name: Smoke test x86_64-linux-musl gem on Ruby ${{ matrix.ruby }}
    needs: build-native-gems
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
    steps:
      - name: Download gem artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gem-x86_64-linux-musl

      - name: Smoke test native gem
        env:
          RUBY_IMAGE: ruby:${{ matrix.ruby }}-alpine
        run: |
          docker run --rm -v "$PWD:/gems:ro" -w /gems "$RUBY_IMAGE" sh -ec '
            gem install ./*.gem --no-document
            ruby -e "require %q(maxmind/db/rust); puts MaxMind::DB::Rust::Reader"
          '

  # Build source gem (fallback for unsupported platforms)
  build-source-gem:
    name: Build source gem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1
        with:
          ruby-version: "4.0"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Build source gem
        run: |
          gem build maxmind-db-rust.gemspec

      - name: Smoke test source gem
        run: |
          install_dir="$(mktemp -d)"
          gcc_include="$(dirname "$(dirname "$(command -v gcc)")")/lib/gcc/$(gcc -dumpmachine)/$(gcc -dumpversion | cut -d. -f1)/include"
          BINDGEN_EXTRA_CLANG_ARGS="-I${gcc_include}" gem install ./*.gem --install-dir "$install_dir" --bindir "$install_dir/bin" --no-document
          GEM_HOME="$install_dir" GEM_PATH="$install_dir" ruby -e 'require "maxmind/db/rust"; puts MaxMind::DB::Rust::Reader'

      - name: Upload source gem artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gem-source
          path: "*.gem"
          if-no-files-found: error

  # Release all gems to RubyGems (only on release events)
  release:
    name: Release gems to RubyGems.org
    runs-on: ubuntu-latest
    needs:
      - test
      - check-version
      - build-native-gems
      - build-source-gem
      - smoke-test-musl-gem
      - smoke-test-native-gems
    if: github.event_name == 'release'
    environment: RubyGems

    permissions:
      id-token: write # Required for trusted publishing
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1
        with:
          ruby-version: "4.0"

      - name: Download all gem artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: all-gems
          pattern: gem-*
          merge-multiple: true

      - name: List gems to be released
        run: |
          echo "Gems to be released:"
          ls -lh all-gems/

      - name: Configure RubyGems for trusted publishing
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish gems to RubyGems.org
        run: |
          set -euo pipefail
          failed=()
          for gem in all-gems/*.gem; do
            if ! read -r name version platform < <(
              ruby -rrubygems/package -e 'spec = Gem::Package.new(ARGV[0]).spec; puts [spec.name, spec.version, spec.platform].join(" ")' "$gem"
            ); then
              echo "::error::Could not read the gem spec from $gem"
              failed+=("$gem")
              continue
            fi
            status="$(curl -sS --retry 3 --retry-delay 5 -o /dev/null -w '%{http_code}' \
              "https://rubygems.org/api/v2/rubygems/${name}/versions/${version}.json?platform=${platform}" || true)"
            case "$status" in
              200)
                echo "Skipping $gem: ${name} ${version} (${platform}) is already on RubyGems.org"
                continue
                ;;
              404) ;;
              *)
                echo "::error::Could not check whether $gem is already on RubyGems.org (HTTP $status)"
                failed+=("$gem")
                continue
                ;;
            esac
            echo "Publishing $gem"
            if ! gem push "$gem"; then
              echo "::error::Failed to publish $gem"
              failed+=("$gem")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::Failed to publish: ${failed[*]}"
            exit 1
          fi
